name: Update formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pull (without the leading v, e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  update:
    name: Pull formula from release and commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Download formula from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ github.event.inputs.version }}" \
            --repo Descry-Technologies/descry \
            --pattern "descry.rb" \
            --output Formula/descry.rb \
            --clobber

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/descry.rb
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: update formula to v${{ github.event.inputs.version }}"
          git push
